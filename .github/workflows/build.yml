name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "README.md"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: activitymux-windows-x64
            bundles: nsis,msi
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
            signed-paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
          - name: Linux x64
            os: ubuntu-22.04
            artifact: activitymux-linux-x64
            bundles: appimage,deb
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
            signed-paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Require updater signing key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set. Tag builds cannot sign updates."
            exit 1
          fi
      - name: Build installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Build signed installers
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.json
      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
      - name: Upload signed installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.signed-paths }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download generated installers
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Build updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version"
            exit 1
          fi
          if ! notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)"; then
            notes="ActivityMux $version"
          fi
          printf '%s\n' "$notes" > release-notes.txt
          python3 .github/scripts/latest-json.py \
            --artifacts release-artifacts \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.txt \
            --output release-artifacts/latest.json
      - name: Package Windows tester bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip -j "release-artifacts/ActivityMux-${version}-windows-x64.zip" \
            release-artifacts/activitymux-windows-x64/nsis/*.exe \
            release-artifacts/activitymux-windows-x64/msi/*.msi
      - name: Generate checksums
        working-directory: release-artifacts
        run: |
          sha256sum \
            activitymux-windows-x64/nsis/*.exe \
            activitymux-windows-x64/nsis/*.exe.sig \
            activitymux-windows-x64/msi/*.msi \
            activitymux-windows-x64/msi/*.msi.sig \
            activitymux-linux-x64/appimage/*.AppImage \
            activitymux-linux-x64/appimage/*.AppImage.sig \
            activitymux-linux-x64/deb/*.deb \
            ActivityMux-*-windows-x64.zip \
            latest.json > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/activitymux-windows-x64/nsis/*.exe \
            release-artifacts/activitymux-windows-x64/nsis/*.exe.sig \
            release-artifacts/activitymux-windows-x64/msi/*.msi \
            release-artifacts/activitymux-windows-x64/msi/*.msi.sig \
            release-artifacts/activitymux-linux-x64/appimage/*.AppImage \
            release-artifacts/activitymux-linux-x64/appimage/*.AppImage.sig \
            release-artifacts/activitymux-linux-x64/deb/*.deb \
            release-artifacts/ActivityMux-*-windows-x64.zip \
            release-artifacts/SHA256SUMS.txt \
            release-artifacts/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "ActivityMux ${GITHUB_REF_NAME#v}"
