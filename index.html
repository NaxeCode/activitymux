<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    <script>
      (() => {
        const aesthetics = ["signal", "storybook", "loveme", "matrix", "tarot", "hearteyes"];
        let aesthetic = "signal";
        let scheme = "dark";
        try {
          const saved = JSON.parse(localStorage.getItem("activitymux.appearance") || "");
          if (aesthetics.includes(saved.aesthetic)) aesthetic = saved.aesthetic;
          if (saved.colorScheme === "light" || saved.colorScheme === "dark") scheme = saved.colorScheme;
        } catch {}
        document.documentElement.dataset.aesthetic = aesthetic;
        document.documentElement.dataset.scheme = scheme;
        document.documentElement.dataset.mantineColorScheme = scheme;
        document.documentElement.style.colorScheme = scheme;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
